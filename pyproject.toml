[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iats"
version = "0.1.0"
description = "Intervention-Aware Track-and-Stop: instance-optimal best-policy identification in causal MDPs with a known graph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
keywords = [
    "causal-inference",
    "reinforcement-learning",
    "best-arm-identification",
    "pure-exploration",
    "track-and-stop",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# CPU-only and lean: numpy powers all the solvers, estimators, and simulations.
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Figure generation for the paper.
paper = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iats"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "experiments", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "experiments"]
extend-exclude = ["scripts", ".paper"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.isort]
known-first-party = ["iats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=iats --cov-report=term-missing"

[tool.coverage.run]
source = ["iats"]
branch = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
